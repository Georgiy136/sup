syntax = "proto3";

package sync_models;

option go_package = "./sync_models";

import "github.com/alta/protopatch/patch/go.proto";

message Categories {
    repeated Category Data = 1 [(go.field).tags = 'json:"data" binding:"required,gt=0,dive"'];

    message Category {
        int64 CategoryID = 1 [(go.field).tags = 'json:"category_id" binding:"required"'];
        string CategoryName = 2 [(go.field).tags = 'json:"category_name" binding:"required"'];
        optional bool IsDel = 3 [(go.field).tags = 'json:"is_del" binding:"required"'];
        int64 ParentCategoryID = 4 [(go.field).tags = 'json:"parent_category_id" binding:"required"'];
        string ParentCategoryName = 5 [(go.field).tags = 'json:"parent_category_name" binding:"required"'];
        optional string ActionID = 6 [(go.field).tags = 'json:"action_id" binding:"omitempty"'];
        int64 ChEmployeeID = 7 [(go.field).tags = 'json:"ch_employee_id" binding:"required"'];
        string ChDt = 8 [(go.field).tags = 'json:"ch_dt" binding:"required"'];
        repeated int64 ChildCategoryIDs = 9 [(go.field).tags = 'json:"child_category_ids" binding:"omitempty,dive"'];
        optional bool IsProd = 10 [(go.field).tags = 'json:"is_prod" binding:"omitempty"'];
        optional string SyncDt = 11 [(go.field).tags = 'json:"sync_dt" binding:"omitempty"'];
        optional int64 SourceCategoryID = 12 [(go.field).tags = 'json:"source_category_id" binding:"omitempty"'];
        repeated int64 ProdCategoryIDs = 13 [(go.field).tags = 'json:"prod_category_ids" binding:"omitempty,dive"'];

        int64 LogId = 100 [(go.field).tags = 'json:"log_id"'];
    }
}