    responses:
      - code: 204
        description: "Группа удалена"
      - code: 422
        description: "Ошибка удаления группы"
        data_example: |-
          {
              "errors" : [
                {
                  "error": "group.notexists",
                  "detail": "group_name: 1000",
                  "message": "Группа с данным номером не существует."
                }
