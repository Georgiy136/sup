title: EmployeeGroupApi
description: |
  Сервис групп доступов

  ### Стандартные ошибки, общие для всех API:
  - статус 400, ошибка валидации входных параметров;
  - статус 401, ошибка проверки авторизации запроса;
  - статус 403, нет прав доступа;
  - статус 422, ошибка бизнес-логики;
  - статус 500, ошибка сервиса.

  Тело ошибок представлено в формате
  ```json
  {
    "errors": [
      {
        "error": "error_code",
        "message": "error message to user",
        "detail": "some error details data"
      }
    ]
  }
  ```
httpApis:
  - title: Создание группы доступа
    api: post|api/groups/create
    auth_type: basic+e
    auth_actions:
      - "action.accessManager"
    query:
      type_name: QueryParams
      fields:
        - Name: EmployeeID
          Type: int64
          Tag: uri:"employee_id" binding:"required,EmployeeID"
    body:
      structure_name: CreateGroup
      schema:
        - type_name: CreateGroup
          fields:
            - Name: GroupName
              Type: string
              Tag: 'json:"group_name" binding:"required,max=100"'
            - Name: ExternalAction
              Type: "*string"
              Tag: 'json:"external_action" binding:"omitempty,max=100"'
    do: CUSTOM|CreateGroup|BODY;employee_id
    responses:
      - code: 200
        description: "Группа создана"
        data_example: |-
          {
            "data": [
              {
                "group_id": 10,
                "group_name": "hahaha",
                "external_action": "CreateCategory.Main"
              }
            ]
          }
      - code: 422
        description: "Ошибка создания группы"
        data_example: |-
          {
              "errors" : [
                {
                  "error"  : "group.alreadyexists",
                  "detail" : "group_name: hahaha",
                  "message": "Группа доступа с данным названием уже существует."
                }
              ]
          }

  - title: Редактирование внешнего экшена у группы доступа
    api: post|api/groups/update_external_action
