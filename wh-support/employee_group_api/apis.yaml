      - "action.accessManager"
    query:
      type_name: QueryParams
      fields:
        - Name: EmployeeID
          Type: int64
          Tag: uri:"employee_id" binding:"required,EmployeeID"
    body:
      structure_name: AddGroupToCategory
      schema:
        - type_name: AddGroupToCategory
          fields:
            - Name: CategoryID
              Type: int64
              Tag: 'json:"category_id" binding:"required,gt=0"'
            - Name: TypeActionID
              Type: string
              Tag: 'json:"typeaction_id" binding:"required,min=5,max=50"'
            - Name: GroupID
              Type: int64
              Tag: 'json:"group_id" binding:"required,LteInt32"'
    do: CUSTOM|AddGroupToCategory|BODY;employee_id
    responses:
      - code: 200
        description: "Группа добавлена в категорию"
        data_example: |-
          {
            "data": [
              {
                "category_id": 31,
                "typeaction_id": 'status_category',
                "group_id": 55
              }
            ]
          }
      - code: 422
        description: "Такая связка категории с группой уже существует"
        data_example: |-
          {
            "errors": [
              {
                "error": "categorygroup.alreadyexists",
                "detail": "category_id: 31, typeaction_id: create_ticket_category, group_id: 55",
                "message": "Такая связка категории с группой уже существует."
              }
