    query:
      type_name: QueryParams
      fields:
        - Name: EmployeeID
          Type: int64
          Tag: uri:"employee_id" binding:"required,EmployeeID"
    body:
      structure_name: UpdateExternalActionGroup
      schema:
        - type_name: UpdateExternalActionGroup
          fields:
            - Name: GroupID
              Type: int64
              Tag: 'json:"group_id" binding:"required,LteInt32"'
            - Name: ExternalAction
              Type: "*string"
              Tag: 'json:"external_action" binding:"omitempty,max=100"'
    do: CUSTOM|UpdateExternalActionGroup|BODY;employee_id
    responses:
      - code: 200
        description: "Группа обновлена"
        data_example: |-
          {
            "data": [
              {
                "group_id": 55,
                "group_name": "Тестовая группа на перформ",
          	    "external_action": "CreateCategory.Main"
              }
            ]
          }
      - code: 422
        description: "Ошибка обновления группы"
        data_example: |-
          {
              "errors" : [
                {
                  "error"  : "group.alreadyexists",
                  "detail" : "group_name: hahaha",
                  "message": "Группа доступа с данным названием уже существует."
                }
              ]
          }

