title: TicketApi
description: |
  Сервис заявок

  ### Стандартные ошибки, общие для всех API:
  - статус 400, ошибка валидации входных параметров;
  - статус 401, ошибка проверки авторизации запроса;
  - статус 403, нет прав доступа;
  - статус 422, ошибка бизнес-логики;
  - статус 500, ошибка сервиса.

  Тело ошибок представлено в формате
  ```json
  {
    "errors": [
      {
        "error": "error_code",
        "message": "error message to user",
        "detail": "some error details data"
      }
    ]
  }
  ```
httpApis:
  - title: Создать новую заявку V2
    api: post|api/tickets/create
    auth_type: basic+e
    query:
      type_name: QueryParams
      fields:
        - Name: EmployeeID
          Type: int64
          Tag: uri:"employee_id" binding:"required,EmployeeID"
    body:
      structure_name: BodyStruct
      schema:
        - type_name: BodyStruct
          fields:
            - Name: CategoryID
              Type: "int64"
              Tag: 'json:"category_id" binding:"required,gt=0"'
            - Name: ScenarioOrderID
              Type: "*int64"
              Tag: 'json:"scenario_order_id" binding:"required,gte=0"'
            - Name: TicketName
              Type: "string"
              Tag: 'json:"ticket_name" binding:"required,lte=300"'
            - Name: InfoForCreate
              Type: "json.RawMessage"
              Tag: 'json:"info_for_create"'
    do: CUSTOM|CreateTicket|BODY;employee_id
    responses:
      - code: 200
        description: "Заявка создана"
        data_example: |-
          {
            "data": [
              {
                "ticket_id": 32,
              }
            ]
          }
      - code: 400
        description: "Ошибка валидации: название заявки содержит URL"
        data_example: |-
          {
            "errors": [
              {
                "error": "std.std.err_vld.request.body.wrong",
                "message": "Incorrect request format.",
                "detail": "ID:a61cfb10-0f9e-4348-5d72-e0648190e7cd; ticket name must not contain URLs, 'https://example.com'"
              }
            ]
          }
      - code: 422
        description: "Ошибка создания заявки"
        data_example: |-
          {
            "errors": [
              {
                "error": "category.notfound" ,
                "message": "Категории не существует" ,
                "detail": "category_id: 3"
              }
            ]
          }

