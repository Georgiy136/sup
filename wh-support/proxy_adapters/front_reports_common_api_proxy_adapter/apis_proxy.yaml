              Tag: json:"date_from" binding:"required,IsRFCDate,BeforeDateOrEqual=RFCDate:DateTo"
            - Name: DateTo
              Type: string
              Tag: json:"date_to" binding:"required,IsRFCDate,NoFuture=RFCDate"
            - Name: CategoryIDs
              Type: int64
              Tag: json:"category_ids" binding:"required,unique,min=1,dive,gt=0"
              IsSlice: true
    do: reports_common_api_client

  - title: API заявок по годам
    api: POST|/api/support/last_status/year
    auth_type: keycloak
    proxy_employee_id: true
    body:
      structure_name: InputStruct
      schema:
        - type_name: InputStruct
          fields:
            - Name: DateFrom
              Type: string
              Tag: json:"date_from" binding:"required,IsRFCDate,BeforeDateOrEqual=RFCDate:DateTo"
            - Name: DateTo
              Type: string
              Tag: json:"date_to" binding:"required,IsRFCDate,NoFuture=RFCDate"
            - Name: CategoryIDs
              Type: int64
              Tag: json:"category_ids" binding:"required,unique,min=1,dive,gt=0"
              IsSlice: true
    do: reports_common_api_client

