title: FrontResourcesEmployeeAccessProxyAdapter
description: Прокси адаптер для портала (получение ресурсов)

httpApis:
  - title: Получение списка ресурсов, доступных сотруднику (по токену авторизации).
    description: "Возвращает список ресурсов, доступных сотруднику"
    api: get|api/resources_by_employee_id
    auth_type: keycloak
    proxy_employee_id: true
    do: resources_employee_access_client

  - title: Получение списка всех action_ids.
    description: "Возвращает список всех action_ids"
    api: get|api/get_all_actions
    auth_type: keycloak
    proxy_employee_id: true
    do: resources_employee_access_client

  - title: Получение списка всех action_ids V2
    description: "Возвращает список всех action_ids"
    api: get|api/actions/get_all
    auth_type: keycloak
    proxy_employee_id: true
    do: resources_employee_access_client

  - title: Создание ресурса
    description: "Создание нового права для пользователей"
    api: post|api/create_action
    auth_type: keycloak
    proxy_employee_id: true
    body:
      structure_name: CreateAction
      schema:
        - type_name: CreateAction
          fields:
            - Name: ActionID
              Type: string
              Tag: 'json:"action_id" binding:"required,max=50"'
            - Name: ActionDesc
              Type: string
              Tag: 'json:"action_desc" binding:"required,max=200"'
    do: resources_employee_access_client

  - title: Создание ресурса V2
    description: "Создание нового права для пользователей"
    api: post|api/actions/create
    auth_type: keycloak
    proxy_employee_id: true
    body:
      structure_name: CreateAction
      schema:
        - type_name: CreateAction
          fields:
            - Name: ActionID
              Type: string
              Tag: 'json:"action_id" binding:"required,max=50"'
            - Name: ActionDesc
              Type: string
              Tag: 'json:"action_desc" binding:"required,max=200"'
    do: resources_employee_access_client

  - title: Изменение ресурса для пользователя (добавить, удалить)
    description: "Изменяет указанное право сотрудника"
    api: post|api/update_action
    auth_type: keycloak
    proxy_employee_id: true
    body:
      structure_name: UpdateAction
      schema:
        - type_name: UpdateAction
          fields:
            - Name: EmployeeID
              Type: int64
              Tag: 'json:"employee_id" binding:"required,EmployeeID"'
            - Name: ActionID
              Type: string
              Tag: 'json:"action_id" binding:"required,max=50"'
            - Name: IsDel
              Type: "*bool"
              Tag: 'json:"is_del" binding:"omitempty"'
    do: resources_employee_access_client

  - title: Изменение ресурса для пользователя (добавить, удалить) V2
    description: "Изменяет указанное право пользователя"
    api: post|api/actions/update_for_employee
    auth_type: keycloak
    proxy_employee_id: true
    body:
      structure_name: UpdateAction
      schema:
        - type_name: UpdateAction
          fields:
            - Name: EmployeeID
              Type: int64
              Tag: 'json:"employee_id" binding:"required,EmployeeID"'
            - Name: ActionID
              Type: string
              Tag: 'json:"action_id" binding:"required,max=50"'
            - Name: IsDel
              Type: "*bool"
              Tag: 'json:"is_del" binding:"omitempty"'
    do: resources_employee_access_client

  - title: Удаление ресурса
    description: "Удаляет указанное право из системы и для всех сотрудников"
    api: get|api/delete_action
    auth_type: keycloak
    proxy_employee_id: true
    query:
      type_name: Query
      fields:
        - Name: ActionID
          Type: string
          Tag: uri:"action_id" binding:"required,max=50"
    do: resources_employee_access_client

  - title: Получение всех сотрудников по определенному праву
    description: "Получение всех сотрудников по определенному праву"
    api: post|api/get_employees_by_action
    auth_type: keycloak
    proxy_employee_id: true
    body:
      structure_name: InputStruct
      schema:
        - type_name: InputStruct
          fields:
            - Name: ActionID
              Type: string
              Tag: 'json:"action_id" binding:"required,max=50"'
    do: resources_employee_access_client

  - title: Получение доступов по employee_id сотрудника
    description: "Получение списка доступов Access в wh-support по employee_id сотрудника"
    api: get|api/get_access_actions_by_employee_id
    auth_type: keycloak
    proxy_employee_id: true
    do: resources_employee_access_client

  - title: Получение всех типов действий
    description: "Получение всех типов действий"
    api: get|api/type_actions
    auth_type: keycloak
    proxy_employee_id: true
    do: resources_employee_access_client

  - title: Создание типа действия
    description: "Создаёт тип действия с переданным идентификатором и описанием"
    api: post|api/type_actions/create
    auth_type: keycloak
    proxy_employee_id: true
    do: resources_employee_access_client

  - title: Удаление типа действия
    description: "Удаляет тип действия с переданным идентификатором"
    api: post|api/type_actions/delete
    auth_type: keycloak
    proxy_employee_id: true
    do: resources_employee_access_client
    responses:
      - code: 204
        description: тип действия успешно удалён